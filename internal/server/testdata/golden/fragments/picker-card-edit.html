

<section class="card fold" id="picker" style="--hue:var(--sec-activity)"
         x-data="{open: true}"
         
         x-init="if (location.hash === '#picker') setTimeout(() => $el.scrollIntoView({block: 'start'}), 60)"
         @hashchange.window="if (location.hash === '#picker') { open = true; setTimeout(() => $el.scrollIntoView({block: 'start'}), 60) }">
  <div class="fold-head">
    <h2><span class="ic"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18h3"/></svg></span> Your quick picker</h2>
    
    <button type="button" class="ghost icon fold-toggle" :aria-expanded="open" @click="open=!open" title="Show or hide" aria-label="Show or hide the quick picker"><svg class="todo-chev" :class="{open: open}" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <p class="fold-sum">It offers Mum, with the overnight option off.</p>
  <div class="fold-body" x-show="open" x-cloak>
    
    
    
    <p class="subtitle" style="margin-top:0">The picker is for the household rather than for visitors. It lives on your own phone, and a tap puts that rego on the permit until the end of the day, exactly as a booking made here would.</p>
    
    <form method="post" action="/guests/picker/update" hx-post="/guests/picker/update" hx-target="#picker" hx-swap="outerHTML" class="stack"
          x-data="{all: false}">
      
      <label class="toggle" style="align-items:flex-start;gap:11px"><input type="checkbox" name="all_vehicles" value="1" x-model="all" style="margin-top:2px"> <span>Offer <strong>every rego</strong>, including any added later<br><span class="muted" style="font-size:12.5px">Untick this to choose which regos it offers.</span></span></label>
      <div class="fld" x-show="!all" x-cloak><span>Regos it offers</span>
        <div class="checks">
          
          <label class="check">
            <input type="checkbox" name="vehicle_id" value="1" checked>
            <span class="dot" style="background:#111"></span>
            <span class="cname">Mum</span>
            <span class="plate" style="--plate:#111">AAA111</span>
          </label>
          
          <label class="check">
            <input type="checkbox" name="vehicle_id" value="2">
            <span class="dot" style="background:#222"></span>
            <span class="cname">Dad</span>
            <span class="plate" style="--plate:#222">AAA222</span>
          </label>
          
        </div>
      </div>
      <label class="toggle" style="align-items:flex-start;gap:11px"><input type="checkbox" name="allow_overnight" checked style="margin-top:2px"> <span>Offer an <strong>overnight</strong> option<br><span class="muted" style="font-size:12.5px">Keeps a rego on until the end of tomorrow rather than today. When the time is up the roster takes over; if nothing is scheduled, the rego stays on the permit until the next change.</span></span></label>
      <div class="row" style="gap:10px">
        <button type="submit"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg> Save changes</button>
        <a href="/guests#picker" hx-get="/guests/picker" hx-target="#picker" hx-swap="outerHTML" class="btnlike ghost">Cancel</a>
      </div>
    </form>
    
  </div>
</section>
